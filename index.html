<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>快递领取管理</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4f46e5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="快递领取" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --amber: #d97706;
    --amber-bg: #fef3c7;
    --green: #059669;
    --green-bg: #d1fae5;
    --red: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .app { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  header h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .storage-tip { font-size: 12px; color: var(--muted); }
  .stats { display: flex; gap: 10px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; color: var(--muted); box-shadow: var(--shadow);
  }
  .stat b { font-size: 18px; margin-left: 6px; }
  .stat.pending b { color: var(--amber); }
  .stat.picked b { color: var(--green); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 16px; }

  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .form-grid .field { display: flex; flex-direction: column; gap: 5px; }
  .form-grid label { font-size: 12px; color: var(--muted); }
  input, select {
    font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--text); outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .btn {
    font: inherit; border: none; border-radius: 9px; padding: 9px 16px; cursor: pointer;
    background: var(--primary); color: #fff; font-weight: 600; transition: background .15s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-add { align-self: end; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .ocr-row {
    margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    border-top: 1px dashed var(--border); padding-top: 14px;
  }
  .btn-ocr { background: #0ea5e9; }
  .btn-ocr:hover { background: #0284c7; }
  .btn-ocr-alt { background: #7c3aed; }
  .btn-ocr-alt:hover { background: #6d28d9; }
  .ocr-status { font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
  .ocr-status.busy { color: var(--primary); }
  .option-panel { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #fafafa; }
  .option-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .option-panel-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .option-panel-hint { font-size: 12px; color: var(--muted); }
  .option-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-item {
    display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px;
    background: #fff; overflow: hidden; transition: border-color .15s;
  }
  .option-item:hover { border-color: var(--primary); }
  .option-pick {
    border: none; background: transparent; padding: 7px 12px; font: inherit; font-size: 13px;
    cursor: pointer; color: var(--text); white-space: nowrap;
  }
  .option-del {
    border: none; background: transparent; color: var(--muted); padding: 0 8px; font-size: 16px;
    cursor: pointer; line-height: 1; transition: color .15s;
  }
  .option-del:hover { color: var(--red); }
  .option-empty { font-size: 13px; color: var(--muted); }

  .toolbar { margin-bottom: 14px; }
  .toolbar input { max-width: 320px; }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
  .section-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; }
  .section-head h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .count-pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .count-pill.amber { background: var(--amber-bg); color: var(--amber); }
  .count-pill.green { background: var(--green-bg); color: var(--green); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .seg button {
    border: none; background: #fff; padding: 6px 12px; font: inherit; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--primary); color: #fff; }

  ul.records { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .record {
    display: flex; align-items: center; gap: 14px; padding: 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .record:last-child { border-bottom: none; }
  .record:hover { background: #fafafa; }

  .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; flex-shrink: 0; }
  .check-label input { display: none; }
  .custom-check {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid #cbd5e1;
    display: inline-flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0;
  }
  .check-label input:checked + .custom-check { background: var(--green); border-color: var(--green); }
  .check-label input:checked + .custom-check::after { content: "✓"; color: #fff; font-size: 14px; line-height: 1; }

  .record-main { flex: 1; min-width: 0; }
  .record-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px;
    background: #eef2ff; color: var(--primary);
  }
  .code { font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .5px; }
  .record-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .time-chip { font-size: 12px; color: var(--green); background: var(--green-bg); border-radius: 6px; padding: 2px 8px; font-weight: 600; }

  .icon-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 6px 10px;
    cursor: pointer; font-size: 12px; color: var(--muted); transition: all .15s; white-space: nowrap;
  }
  .icon-btn:hover { border-color: #cbd5e1; color: var(--text); }
  .icon-btn.danger:hover { border-color: #fca5a5; color: var(--red); }

  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 14px; }

  details.picked-section > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 15px 18px; user-select: none;
  }
  details.picked-section > summary::-webkit-details-marker { display: none; }
  details.picked-section > summary .arrow { transition: transform .2s; }
  details.picked-section[open] > summary .arrow { transform: rotate(180deg); }
  .summary-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  details.picked-section > summary .summary-right { display: inline-flex; align-items: center; gap: 10px; }

  details.date-group { border-top: 1px solid var(--border); }
  details.date-group > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 11px 18px; background: #fafafa; user-select: none; font-weight: 600; font-size: 14px;
  }
  details.date-group > summary::-webkit-details-marker { display: none; }
  details.date-group > summary .arrow { transition: transform .2s; color: var(--muted); }
  details.date-group[open] > summary .arrow { transform: rotate(180deg); }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .25s; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 680px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .record { flex-wrap: wrap; }
    .check-label { order: 2; }
  }
.check-text { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>📦 快递领取管理</h1>
      <div class="storage-tip">数据保存在浏览器本地（localStorage），无需联网。</div>
    </div>
    <div class="stats">
      <div class="stat pending">待领取<b id="statPending">0</b></div>
      <div class="stat picked">已领取<b id="statPicked">0</b></div>
    </div>
  </header>

  <section class="card">
    <h2>＋ 录入新快递</h2>
    <form id="addForm" class="form-grid" autocomplete="off">
      <div class="field">
        <label for="fCode">取件码 *</label>
        <input id="fCode" placeholder="例如 1-2-3456" required />
      </div>
      <div class="field">
        <label for="fCompany">快递公司 *</label>
        <input id="fCompany" placeholder="选择或输入" required />
      </div>
      <div class="field">
        <label for="fOwner">所属人 *</label>
        <input id="fOwner" placeholder="选择或输入姓名" required />
      </div>
      <div class="field">
        <label for="fNote">备注</label>
        <input id="fNote" placeholder="选填" />
      </div>
      <button type="submit" class="btn btn-add">添加</button>
    </form>
    <div class="ocr-row">
      <button type="button" class="btn btn-ocr" id="btnOcrPick">📷 上传截图</button>
      <button type="button" class="btn btn-ocr btn-ocr-alt" id="btnOcrCamera">📸 拍照</button>
      <span class="ocr-status" id="ocrStatus">可上传取件通知截图，自动识别快递公司和取件码；所属人请手动选择。</span>
      <input type="file" id="ocrFile" accept="image/*" hidden />
    </div>
    <div class="option-panel" id="optionPanel" hidden>
      <div class="option-panel-head">
        <span class="option-panel-title" id="optionPanelTitle">可选项</span>
        <span class="option-panel-hint" id="optionPanelHint"></span>
      </div>
      <div class="option-list" id="optionList"></div>
    </div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 搜索取件码 / 公司 / 所属人 / 备注" />
  </div>

  <section class="section">
    <div class="section-head">
      <h2>⏳ 待领取 <span class="count-pill amber" id="pendingCount">0</span></h2>
      <div class="seg" id="pendingGroupToggle">
        <button type="button" data-mode="owner" class="active">按所属人</button>
        <button type="button" data-mode="company">按快递公司</button>
      </div>
    </div>
    <div id="pendingList"></div>
    <div class="empty" id="pendingEmpty" hidden>暂无待领取快递</div>
  </section>

  <section class="section">
    <details class="picked-section" id="pickedSection">
      <summary>
        <span class="summary-title">✅ 已领取 <span class="count-pill green" id="pickedCount">0</span></span>
        <span class="summary-right">
          <button type="button" class="icon-btn danger" id="clearPicked">清空</button>
          <span class="arrow">▼</span>
        </span>
      </summary>
      <div id="pickedGroups"></div>
    </details>
  </section>
</div>

<div id="toast"></div>

<script src="./tesseract/tesseract.min.js"></script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "express_records_v1";
  var records = load();
  var pendingGroupBy = "owner";
  var OWNER_KEY = "owner_options_v1";
  var OWNER_PRESETS = ["钰钰 7576", "钰钰妈妈 6499", "杨杨妈妈 0268", "杨杨爸爸 2278", "杨杨哥 6493"];
  var ownerOptions = loadOwnerOptions();
  var COMPANY_PRESETS = ["中通", "圆通", "申通", "韵达", "顺丰", "京东", "邮政EMS", "极兔", "德邦", "菜鸟", "其他"];
  var activeField = null;

  var $ = function (sel) { return document.querySelector(sel); };
  var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function timeStr(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function todayKey() { return dateKey(Date.now()); }
  function yesterdayKey() { return dateKey(Date.now() - 24 * 3600 * 1000); }

  function groupLabel(key) {
    if (key === todayKey()) return "今天";
    if (key === yesterdayKey()) return "昨天";
    var parts = key.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
    return Number(parts[1]) + "月" + Number(parts[2]) + "日 " + week;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addRecord() {
    var code = $("#fCode").value.trim();
    var company = $("#fCompany").value.trim();
    var owner = $("#fOwner").value.trim();
    var note = $("#fNote").value.trim();
    if (!code || !company || !owner) { toast("请填写取件码、快递公司和所属人"); return; }

    records.push({
      id: uid(),
      code: code,
      company: company,
      owner: owner,
      note: note,
      status: "pending",
      createdAt: Date.now(),
      pickedAt: null
    });
    save();
    addOwnerOption(owner);
    $("#addForm").reset();
    render();
    toast("已添加，状态：待领取");
  }

  function setPicked(id, picked) {
    var r = records.find(function (x) { return x.id === id; });
    if (!r) return;
    if (picked) {
      r.status = "picked";
      r.pickedAt = Date.now();
    } else {
      r.status = "pending";
      r.pickedAt = null;
    }
    save();
    render();
    toast(picked ? "已标记为「已领取」" : "已恢复为「待领取」");
  }

  function removeRecord(id) {
    var r = records.find(function (x) { return x.id === id; });
    if (!r) return;
    if (!confirm("确定删除该快递？\n取件码：" + r.code + "（" + r.company + "）")) return;
    records = records.filter(function (x) { return x.id !== id; });
    save();
    render();
    toast("已删除");
  }

  function filtered() {
    var kw = $("#search").value.trim().toLowerCase();
    if (!kw) return records;
    return records.filter(function (r) {
      return [r.code, r.company, r.owner, r.note].join(" ").toLowerCase().indexOf(kw) !== -1;
    });
  }

  function loadOwnerOptions() {
    try {
      var raw = localStorage.getItem(OWNER_KEY);
      var arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr)) return arr;
    } catch (e) {}
    return OWNER_PRESETS.slice();
  }

  function saveOwnerOptions() {
    localStorage.setItem(OWNER_KEY, JSON.stringify(ownerOptions));
  }

  function addOwnerOption(name) {
    if (!name) return;
    if (ownerOptions.indexOf(name) === -1) {
      ownerOptions.push(name);
      saveOwnerOptions();
    }
  }

  function removeOwnerOption(name) {
    ownerOptions = ownerOptions.filter(function (o) { return o !== name; });
    saveOwnerOptions();
  }

  function mergeRecordOwners() {
    var changed = false;
    records.forEach(function (r) {
      if (r.owner && ownerOptions.indexOf(r.owner) === -1) {
        ownerOptions.push(r.owner);
        changed = true;
      }
    });
    if (changed) saveOwnerOptions();
  }

  function showOptionsFor(field) {
    activeField = field;
    var title = $("#optionPanelTitle");
    var hint = $("#optionPanelHint");
    var list = $("#optionList");
    list.innerHTML = "";
    var options = field === "company" ? COMPANY_PRESETS : ownerOptions;
    var deletable = field === "owner";
    title.textContent = field === "company" ? "选择快递公司" : "选择所属人";
    hint.textContent = deletable ? "点击选择，点 × 删除" : "点击选择";
    options.forEach(function (name) {
      var item = document.createElement("span");
      item.className = "option-item";
      var pick = document.createElement("button");
      pick.type = "button";
      pick.className = "option-pick";
      pick.textContent = name;
      pick.dataset.value = name;
      item.appendChild(pick);
      if (deletable) {
        var del = document.createElement("button");
        del.type = "button";
        del.className = "option-del";
        del.textContent = "×";
        del.title = "删除该选项";
        del.dataset.value = name;
        item.appendChild(del);
      }
      list.appendChild(item);
    });
    if (options.length === 0) {
      var empty = document.createElement("span");
      empty.className = "option-empty";
      empty.textContent = "暂无选项，输入新所属人后会自动添加";
      list.appendChild(empty);
    }
    $("#optionPanel").hidden = false;
  }

  function hideOptions() {
    activeField = null;
    $("#optionPanel").hidden = true;
  }

  // ---- 截图 OCR 识别 ----
  function extractCompany(text) {
    var map = [
      { value: "邮政EMS", keys: ["邮政", "EMS", "ems"] },
      { value: "京东", keys: ["京东"] },
      { value: "中通", keys: ["中通"] },
      { value: "圆通", keys: ["圆通"] },
      { value: "申通", keys: ["申通"] },
      { value: "韵达", keys: ["韵达"] },
      { value: "顺丰", keys: ["顺丰"] },
      { value: "极兔", keys: ["极兔"] },
      { value: "德邦", keys: ["德邦"] },
      { value: "菜鸟", keys: ["菜鸟"] }
    ];
    for (var i = 0; i < map.length; i++) {
      for (var j = 0; j < map[i].keys.length; j++) {
        if (text.indexOf(map[i].keys[j]) !== -1) return map[i].value;
      }
    }
    return "";
  }

  function normalizeCode(s) {
    return String(s || "")
      .replace(/[\s\u3000]+/g, "")
      .replace(/[\u2014\u2013\u2015\u2212\uFF0D\u4e00]/g, "-")
      .toUpperCase();
  }

  function extractCode(text) {
    var t = text.replace(/\s+/g, " ");
    var kw = t.match(/(?:取件码|取货码|提货码|取件验证码|取件密码|快递码)[：:\s]*([0-9A-Za-z][0-9A-Za-z\-–—·.\s]{1,12})/);
    if (kw) {
      var c = normalizeCode(kw[1]);
      if (c.length >= 3) return c;
    }
    var seg = t.match(/(?:^|[^0-9A-Za-z])([0-9A-Za-z]{1,2}[-–—][0-9A-Za-z]{1,2}[-–—][0-9A-Za-z]{3,6})(?![0-9A-Za-z])/);
    if (seg) return normalizeCode(seg[1]);
    var tail = t.match(/(?:码)[：:\s]*([0-9A-Za-z]{4,10})/);
    if (tail) return normalizeCode(tail[1]);
    return "";
  }

  function setOcrBusy(busy) {
    $("#btnOcrPick").disabled = busy;
    $("#btnOcrCamera").disabled = busy;
    $("#ocrStatus").classList.toggle("busy", busy);
  }

  function applyOcr(text) {
    var code = extractCode(text);
    var company = extractCompany(text);
    var codeInput = $("#fCode");
    var companyInput = $("#fCompany");
    var got = [];
    if (code && !codeInput.value.trim()) { codeInput.value = code; got.push("取件码 " + code); }
    if (company && !companyInput.value.trim()) { companyInput.value = company; got.push("公司 " + company); }
    var status = $("#ocrStatus");
    status.title = text;
    if (got.length) {
      status.textContent = "已识别：" + got.join("、") + "。请核对，并手动选择所属人。";
      toast("识别完成：" + got.join("、"));
    } else {
      status.textContent = "未能自动识别，请按原文手动填写（长按此处可查看识别文本）。";
      toast("未能自动识别取件码/公司，请手动填写");
    }
  }

  function runOcr(file) {
    if (!file) return;
    if (!window.Tesseract) {
      toast("OCR 组件未加载，请刷新后重试");
      return;
    }
    var status = $("#ocrStatus");
    setOcrBusy(true);
    status.textContent = "正在识别，请稍候…（首次使用需加载约 20MB 语言包）";
    var base = new URL("./tesseract/", window.location.href).href;
    Tesseract.recognize(file, "chi_sim", {
      workerPath: base + "worker.min.js",
      corePath: base + "tesseract-core.wasm.js",
      langPath: base + "lang",
      logger: function (m) {
        if (m && m.status === "recognizing text") {
          status.textContent = "识别中 " + Math.round((m.progress || 0) * 100) + "%…";
        }
      }
    }).then(function (res) {
      applyOcr((res && res.data && res.data.text) || "");
      setOcrBusy(false);
    }).catch(function (err) {
      console.error("OCR 失败", err);
      toast("识别失败，请手动填写或重试");
      status.textContent = "识别失败，可手动填写或重新上传";
      setOcrBusy(false);
    });
  }

  function render() {
    var all = filtered();
    var pending = all.filter(function (r) { return r.status === "pending"; })
      .sort(function (a, b) { return b.createdAt - a.createdAt; });
    var picked = all.filter(function (r) { return r.status === "picked"; })
      .sort(function (a, b) { return b.pickedAt - a.pickedAt; });

    // 总览统计（不受搜索影响）
    var totalPending = records.filter(function (r) { return r.status === "pending"; }).length;
    var totalPicked = records.filter(function (r) { return r.status === "picked"; }).length;
    $("#statPending").textContent = totalPending;
    $("#statPicked").textContent = totalPicked;
    $("#pendingCount").textContent = pending.length;
    $("#pickedCount").textContent = picked.length;

    // 待领取：按所属人 / 快递公司分组
    var pendingList = $("#pendingList");
    pendingList.innerHTML = "";
    $("#pendingEmpty").hidden = pending.length > 0;
    var byCompany = pendingGroupBy === "company";
    var pendingGroups = {};
    pending.forEach(function (r) {
      var key = byCompany ? r.company : r.owner;
      (pendingGroups[key] = pendingGroups[key] || []).push(r);
    });
    var groupKeys = Object.keys(pendingGroups).sort(function (a, b) {
      return a.localeCompare(b, "zh");
    });
    groupKeys.forEach(function (key) {
      var items = pendingGroups[key];
      var det = document.createElement("details");
      det.className = "date-group";
      det.open = true;
      var inner = '<summary><span>' + (byCompany ? "📦 " : "👤 ") + esc(key) + "（" + items.length + "件）</span><span class=\"arrow\">▼</span></summary><ul class=\"records\">";
      items.forEach(function (r) {
        var meta = byCompany
          ? ('<div class="record-meta">所属人：' + esc(r.owner) + (r.note ? " · " + esc(r.note) : "") + "</div>")
          : (r.note ? '<div class="record-meta">备注：' + esc(r.note) + "</div>" : "");
        inner +=
          '<li class="record">' +
            '<label class="check-label" title="标记为已领取">' +
              '<input type="checkbox" data-act="picked" data-id="' + r.id + '" />' +
              '<span class="custom-check"></span><span class="check-text">领取</span>' +
            "</label>" +
            '<div class="record-main">' +
              '<div class="record-title"><span class="badge">' + esc(r.company) + '</span><span class="code">' + esc(r.code) + "</span></div>" +
              meta +
            "</div>" +
            '<button class="icon-btn danger" data-act="del" data-id="' + r.id + '">删除</button>' +
          "</li>";
      });
      inner += "</ul>";
      det.innerHTML = inner;
      pendingList.appendChild(det);
    });

    // 已领取：按领取日期分组
    var groups = {};
    picked.forEach(function (r) {
      var k = dateKey(r.pickedAt);
      (groups[k] = groups[k] || []).push(r);
    });
    var keys = Object.keys(groups).sort(function (a, b) { return a < b ? 1 : -1; });
    var container = $("#pickedGroups");
    container.innerHTML = "";
    if (keys.length === 0) {
      container.innerHTML = '<div class="empty">暂无已领取快递</div>';
    }
    keys.forEach(function (k) {
      var items = groups[k];
      var det = document.createElement("details");
      det.className = "date-group";
      det.open = true;
      var inner = '<summary><span>📅 ' + groupLabel(k) + "（" + items.length + "件）</span><span class=\"arrow\">▼</span></summary><ul class=\"records\">";
      items.forEach(function (r) {
        inner +=
          '<li class="record">' +
            '<div class="record-main">' +
              '<div class="record-title"><span class="badge">' + esc(r.company) + '</span><span class="code">' + esc(r.code) + "</span></div>" +
              '<div class="record-meta">所属人：' + esc(r.owner) + (r.note ? " · " + esc(r.note) : "") + "</div>" +
            "</div>" +
            '<span class="time-chip">领取 ' + timeStr(r.pickedAt) + "</span>" +
            '<button class="icon-btn" data-act="unpick" data-id="' + r.id + '">恢复待领取</button>' +
            '<button class="icon-btn danger" data-act="del" data-id="' + r.id + '">删除</button>' +
          "</li>";
      });
      inner += "</ul>";
      det.innerHTML = inner;
      container.appendChild(det);
    });
  }

  var toastTimer;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // 事件委托
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.act === "picked") {
      setPicked(t.dataset.id, t.checked);
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.act === "del") {
      removeRecord(t.dataset.id);
    } else if (t && t.dataset && t.dataset.act === "unpick") {
      setPicked(t.dataset.id, false);
    }
  });
  $("#addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    addRecord();
  });
  $("#search").addEventListener("input", render);
  $("#fCompany").addEventListener("focus", function () { showOptionsFor("company"); });
  $("#fOwner").addEventListener("focus", function () { showOptionsFor("owner"); });
  $("#fCompany").addEventListener("blur", function () { setTimeout(function () { if (activeField === "company") hideOptions(); }, 200); });
  $("#fOwner").addEventListener("blur", function () { setTimeout(function () { if (activeField === "owner") hideOptions(); }, 200); });

  $("#optionList").addEventListener("pointerdown", function (e) {
    if (e.target.closest(".option-pick, .option-del")) e.preventDefault();
  });
  $("#optionList").addEventListener("click", function (e) {
    var pick = e.target.closest(".option-pick");
    var del = e.target.closest(".option-del");
    if (pick) {
      var input = activeField === "company" ? $("#fCompany") : $("#fOwner");
      input.value = pick.dataset.value;
      hideOptions();
      input.blur();
    } else if (del) {
      removeOwnerOption(del.dataset.value);
      showOptionsFor("owner");
    }
  });
  $("#pendingGroupToggle").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn || !btn.dataset.mode) return;
    pendingGroupBy = btn.dataset.mode;
    Array.prototype.forEach.call($("#pendingGroupToggle").querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });
  $("#clearPicked").addEventListener("click", function (e) {
    e.stopPropagation();
    e.preventDefault();
    var count = records.filter(function (r) { return r.status === "picked"; }).length;
    if (count === 0) { toast("暂无已领取快递"); return; }
    if (!confirm("确定清空全部已领取快递（共 " + count + " 条）？此操作不可撤销。")) return;
    records = records.filter(function (r) { return r.status !== "picked"; });
    save();
    render();
    toast("已清空全部已领取快递");
  });

  var ocrInput = $("#ocrFile");
  $("#btnOcrPick").addEventListener("click", function () {
    ocrInput.removeAttribute("capture");
    ocrInput.click();
  });
  $("#btnOcrCamera").addEventListener("click", function () {
    ocrInput.setAttribute("capture", "environment");
    ocrInput.click();
  });
  ocrInput.addEventListener("change", function () {
    var f = ocrInput.files && ocrInput.files[0];
    if (f) runOcr(f);
    ocrInput.value = "";
  });

  mergeRecordOwners();
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    var firstRun = !navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (firstRun) { firstRun = false; return; }
      window.location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("SW 注册失败：", err);
      });
    });
  }
</script>
</body>
</html>
